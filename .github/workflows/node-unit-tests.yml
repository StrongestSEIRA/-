name: SHIORI checks

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  node-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run isolated Node tests (no live Supabase, no browser)
        run: npm run test:unit
        env:
          TEST_REPORT_DIR: test-results/unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results
          path: test-results/unit/
          retention-days: 7



  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shiori_test
          POSTGRES_HOST_AUTH_METHOD: trust # disposable isolated CI database only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:db
        env:
          TEST_REPORT_DIR: test-results/database
          SHIORI_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/shiori_test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-results
          path: test-results/database/
          retention-days: 7

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shiori_test
          POSTGRES_HOST_AUTH_METHOD: trust # disposable isolated CI database only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install Chromium matching the locked Playwright version
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: npm run test:browser
        env:
          TEST_REPORT_DIR: test-results/browser
          SHIORI_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/shiori_test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/browser/
          retention-days: 7
