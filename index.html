<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>飲酒記録アプリ</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f6fb;
        color: #1f2937;
      }

      .app {
        width: min(92vw, 420px);
        background: #ffffff;
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 12px 30px rgba(17, 24, 39, 0.08);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 20px;
      }

      h2 {
        margin: 0 0 12px;
        font-size: 18px;
      }

      h3 {
        margin: 18px 0 10px;
        font-size: 16px;
      }

      .nav {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 16px;
      }

      .field {
        display: grid;
        gap: 8px;
        margin-bottom: 14px;
      }

      label {
        font-size: 14px;
        font-weight: 600;
      }

      input,
      button {
        width: 100%;
        height: 44px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        padding: 0 12px;
        font-size: 16px;
      }

      button {
        background: #2563eb;
        color: #fff;
        border-color: #2563eb;
        font-weight: 600;
      }

      .nav button[data-active="true"] {
        background: #1d4ed8;
      }

      .screen {
        display: none;
      }

      .screen[data-visible="true"] {
        display: block;
      }

      .result {
        margin: 6px 0 0;
        font-size: 16px;
        font-weight: 600;
      }

      .granularity-switch {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      .granularity-button[data-active="true"] {
        background: #1d4ed8;
      }

      .record-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 8px;
      }

      .record-item {
        background: #f9fafb;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        padding: 10px;
        font-size: 13px;
        line-height: 1.5;
      }

      .chart-wrapper {
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        background: #ffffff;
        padding: 8px;
      }

      #dailyAlcoholChart {
        width: 100%;
        height: auto;
        display: block;
      }

      .hint {
        margin-top: 8px;
        font-size: 12px;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <main class="app" aria-label="飲酒記録アプリ">
      <h1>飲酒記録アプリ</h1>

      <nav class="nav" aria-label="画面切り替え">
        <button id="showInputScreenButton" type="button" data-active="true">InputScreen</button>
        <button id="showAnalyticsScreenButton" type="button" data-active="false">AnalyticsScreen</button>
      </nav>

      <section id="inputScreen" class="screen" data-visible="true" aria-label="入力画面">
        <h2>InputScreen</h2>

        <div class="field">
          <label for="drinkType">お酒の種類</label>
          <input id="drinkType" name="drinkType" type="text" placeholder="例：ビール、ワイン、日本酒" />
        </div>

        <div class="field">
          <label for="alcoholPercent">アルコール度数（%）</label>
          <input id="alcoholPercent" name="alcoholPercent" type="number" inputmode="decimal" min="0" step="0.1" placeholder="例：5.0" />
        </div>

        <div class="field">
          <label for="amountMl">飲酒量（ml）</label>
          <input id="amountMl" name="amountMl" type="number" inputmode="numeric" min="0" step="1" placeholder="例：350" />
        </div>

        <div class="field">
          <label for="drinkDate">日付</label>
          <input id="drinkDate" name="drinkDate" type="date" />
          <p id="pureAlcoholResult" class="result">純アルコール量: 0.0 g</p>
        </div>

        <div class="field">
          <button id="saveRecordButton" type="button">保存</button>
        </div>
      </section>

      <section id="analyticsScreen" class="screen" data-visible="false" aria-label="分析画面">
        <h2>AnalyticsScreen</h2>

        <h3>純アルコール量（折れ線グラフ）</h3>
        <div class="granularity-switch" aria-label="集計単位切り替え">
          <button id="unitDayButton" class="granularity-button" type="button" data-unit="day" data-active="true">日</button>
          <button id="unitMonthButton" class="granularity-button" type="button" data-unit="month" data-active="false">月</button>
          <button id="unitYearButton" class="granularity-button" type="button" data-unit="year" data-active="false">年</button>
        </div>

        <div class="chart-wrapper">
          <svg id="dailyAlcoholChart" viewBox="0 0 360 220" role="img" aria-label="純アルコール量の折れ線グラフ"></svg>
        </div>
        <p id="chartAxisHint" class="hint">横軸: 日付 / 縦軸: 純アルコール量(g)</p>

        <h3>保存済み記録一覧</h3>
        <ul id="recordList" class="record-list">
          <li class="record-item">まだ記録はありません。</li>
        </ul>
      </section>
    </main>

    <script>
      function calculatePureAlcoholGrams(amountMl, alcoholPercent) {
        return amountMl * (alcoholPercent / 100) * 0.8;
      }

      const inputScreen = document.getElementById("inputScreen");
      const analyticsScreen = document.getElementById("analyticsScreen");
      const showInputScreenButton = document.getElementById("showInputScreenButton");
      const showAnalyticsScreenButton = document.getElementById("showAnalyticsScreenButton");

      const drinkTypeInput = document.getElementById("drinkType");
      const alcoholPercentInput = document.getElementById("alcoholPercent");
      const amountMlInput = document.getElementById("amountMl");
      const drinkDateInput = document.getElementById("drinkDate");
      const pureAlcoholResult = document.getElementById("pureAlcoholResult");
      const saveRecordButton = document.getElementById("saveRecordButton");

      const recordList = document.getElementById("recordList");
      const dailyAlcoholChart = document.getElementById("dailyAlcoholChart");
      const chartAxisHint = document.getElementById("chartAxisHint");
      const unitDayButton = document.getElementById("unitDayButton");
      const unitMonthButton = document.getElementById("unitMonthButton");
      const unitYearButton = document.getElementById("unitYearButton");
      const unitButtons = [unitDayButton, unitMonthButton, unitYearButton];

      const records = [];
      let nextRecordId = 1;
      let currentGranularity = "day";

      function showScreen(screenName) {
        const isInputScreen = screenName === "input";
        inputScreen.dataset.visible = isInputScreen;
        analyticsScreen.dataset.visible = !isInputScreen;
        showInputScreenButton.dataset.active = isInputScreen;
        showAnalyticsScreenButton.dataset.active = !isInputScreen;
      }

      function updatePureAlcoholResult() {
        const alcoholPercent = Number(alcoholPercentInput.value);
        const amountMl = Number(amountMlInput.value);

        if (!alcoholPercentInput.value || !amountMlInput.value) {
          pureAlcoholResult.textContent = "純アルコール量: 0.0 g";
          return 0;
        }

        const pureAlcohol = calculatePureAlcoholGrams(amountMl, alcoholPercent);
        pureAlcoholResult.textContent = `純アルコール量: ${pureAlcohol.toFixed(1)} g`;
        return pureAlcohol;
      }

      function getBucketKey(date, unit) {
        if (unit === "year") {
          return date.slice(0, 4);
        }

        if (unit === "month") {
          return date.slice(0, 7);
        }

        return date;
      }

      function aggregateAlcoholByUnit(unit) {
        const totalsByKey = records.reduce((acc, record) => {
          if (!record.date) {
            return acc;
          }

          const key = getBucketKey(record.date, unit);
          const currentTotal = acc.get(key) || 0;
          acc.set(key, currentTotal + record.pureAlcoholGrams);
          return acc;
        }, new Map());

        return Array.from(totalsByKey.entries()).map(([key, totalAlcohol]) => ({
          label: key,
          totalAlcohol: Number(totalAlcohol.toFixed(1)),
        }));
      }

      function buildChartData(unit) {
        return aggregateAlcoholByUnit(unit).sort((a, b) => a.label.localeCompare(b.label));
      }

      function updateGranularityButtons() {
        unitButtons.forEach((button) => {
          button.dataset.active = button.dataset.unit === currentGranularity;
        });
      }

      function updateChartAxisHint() {
        if (currentGranularity === "month") {
          chartAxisHint.textContent = "横軸: 月(YYYY-MM) / 縦軸: 純アルコール量(g)";
          return;
        }

        if (currentGranularity === "year") {
          chartAxisHint.textContent = "横軸: 年(YYYY) / 縦軸: 純アルコール量(g)";
          return;
        }

        chartAxisHint.textContent = "横軸: 日付 / 縦軸: 純アルコール量(g)";
      }

      function renderRecordList() {
        if (records.length === 0) {
          recordList.innerHTML = '<li class="record-item">まだ記録はありません。</li>';
          return;
        }

        const sortedRecords = [...records].sort((a, b) => a.date.localeCompare(b.date));
        recordList.innerHTML = sortedRecords
          .map(
            (record) =>
              `<li class="record-item">` +
              `日付: ${record.date || "未入力"}<br>` +
              `お酒の種類: ${record.type || "未入力"}<br>` +
              `アルコール度数: ${record.alcoholPercent}%<br>` +
              `飲酒量: ${record.volumeMl} ml<br>` +
              `純アルコール量: ${record.pureAlcoholGrams} g` +
              `</li>`,
          )
          .join("");
      }

      function renderLineChart(data) {
        const width = 360;
        const height = 220;
        const padding = { top: 20, right: 12, bottom: 40, left: 38 };
        const chartWidth = width - padding.left - padding.right;
        const chartHeight = height - padding.top - padding.bottom;

        if (data.length === 0) {
          dailyAlcoholChart.innerHTML =
            `<text x="${width / 2}" y="${height / 2}" text-anchor="middle" font-size="13" fill="#6b7280">表示できるデータがありません</text>`;
          return;
        }

        const maxY = Math.max(...data.map((d) => d.totalAlcohol), 1);
        const xStep = data.length > 1 ? chartWidth / (data.length - 1) : 0;

        const points = data
          .map((item, index) => {
            const x = padding.left + xStep * index;
            const y = padding.top + chartHeight - (item.totalAlcohol / maxY) * chartHeight;
            return `${x},${y}`;
          })
          .join(" ");

        const xLabels = data
          .map((item, index) => {
            const x = padding.left + xStep * index;
            return `<text x="${x}" y="${height - 16}" text-anchor="middle" font-size="10" fill="#6b7280">${item.label}</text>`;
          })
          .join("");

        const yLabels = [0, maxY]
          .map((value) => {
            const y = padding.top + chartHeight - (value / maxY) * chartHeight;
            return `<text x="${padding.left - 6}" y="${y + 4}" text-anchor="end" font-size="10" fill="#6b7280">${value}</text>`;
          })
          .join("");

        dailyAlcoholChart.innerHTML = `
          <line x1="${padding.left}" y1="${padding.top}" x2="${padding.left}" y2="${padding.top + chartHeight}" stroke="#9ca3af" />
          <line x1="${padding.left}" y1="${padding.top + chartHeight}" x2="${padding.left + chartWidth}" y2="${padding.top + chartHeight}" stroke="#9ca3af" />
          <polyline fill="none" stroke="#2563eb" stroke-width="2.5" points="${points}" />
          ${data
            .map((item, index) => {
              const x = padding.left + xStep * index;
              const y = padding.top + chartHeight - (item.totalAlcohol / maxY) * chartHeight;
              return `<circle cx="${x}" cy="${y}" r="3" fill="#2563eb" />`;
            })
            .join("")}
          ${xLabels}
          ${yLabels}
          <text x="${padding.left - 24}" y="${padding.top - 4}" text-anchor="middle" font-size="10" fill="#6b7280">g</text>
        `;
      }

      function renderCurrentChart() {
        updateGranularityButtons();
        updateChartAxisHint();
        renderLineChart(buildChartData(currentGranularity));
      }

      function saveRecord() {
        const pureAlcohol = updatePureAlcoholResult();

        const newRecord = {
          id: nextRecordId,
          type: drinkTypeInput.value,
          alcoholPercent: Number(alcoholPercentInput.value) || 0,
          volumeMl: Number(amountMlInput.value) || 0,
          pureAlcoholGrams: Number(pureAlcohol.toFixed(1)) || 0,
          date: drinkDateInput.value,
        };

        nextRecordId += 1;
        records.push(newRecord);

        renderRecordList();
        renderCurrentChart();
      }

      function switchGranularity(unit) {
        currentGranularity = unit;
        renderCurrentChart();
      }

      alcoholPercentInput.addEventListener("input", updatePureAlcoholResult);
      amountMlInput.addEventListener("input", updatePureAlcoholResult);
      saveRecordButton.addEventListener("click", saveRecord);
      showInputScreenButton.addEventListener("click", () => showScreen("input"));
      showAnalyticsScreenButton.addEventListener("click", () => showScreen("analytics"));

      unitDayButton.addEventListener("click", () => switchGranularity("day"));
      unitMonthButton.addEventListener("click", () => switchGranularity("month"));
      unitYearButton.addEventListener("click", () => switchGranularity("year"));

      renderRecordList();
      renderCurrentChart();
    </script>
  </body>
</html>
