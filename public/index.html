</style></head><body><aside><div class="brand">栞<small>SHIORI / MY LIBRARY</small></div><p class="side-note">本との出会いを、残しておく。<br>言葉のつながりを、育てていく。</p><nav><button class="nav active" data-view="shelf"><span>▤</span> わたしの本棚 <span class="count" id="sideCount">0</span></button><button class="nav" data-view="notes"><span>✎</span> 読書メモ <span class="count" id="noteCount">0</span></button><button class="nav" data-view="tags"><span>♧</span> タグでつながる</button></nav><div class="side-label">COLLECTION</div><button class="collection" id="festival" hidden>購入の記録</button><div class="side-bottom">一冊ずつ、わたしの本棚に。<br><span id="sync">● 保存先を確認中</span><br><button class="export" id="accountButton"><span id="accountName">アカウント</span> ・ 切り替え ↗</button><br><button class="export" id="shareApp">友達にアプリを紹介 ↗</button><br><button class="export" id="export">データを書き出す ↗</button><br><button class="export" id="importBtn">バックアップを読み込む ↙</button></div></aside><main class="main"><header class="topbar"><span class="mobile-brand">栞 <small style="font:9px sans-serif;letter-spacing:2px">SHIORI</small></span><span class="breadcrumb">MY LIBRARY <span style="margin:0 15px">/</span> <b id="crumb">わたしの本棚</b></span><span style="display:flex;align-items:center;gap:15px">A LIFE WITH BOOKS <span class="profile">栞</span></span></header><section class="intro"><div><div class="eyebrow">THE BOOKS WE MEET</div><h1 id="pageTitle">わたしの本棚</h1><p class="sub" id="pageSub">手に取った一冊から、思考のつづきを。</p></div><button class="primary" id="add"><span>＋</span> 本を登録する</button></section><section class="welcome" id="welcome" style="display:none"></section><div id="metadataBar" class="metadata-bar"><span id="metadataProgress">写真だけで登録できます。書籍情報の検索は、本の詳細画面から任意で行えます。</span><button class="link" id="refreshMetadata">書籍情報を再取得 ↻</button></div><section id="controls"><div class="toolbar"><div class="tabs"><button class="tab active" data-status="すべて">すべて <small id="allCount">0</small></button><button class="tab" data-status="未読">未読 <small id="unreadCount">0</small></button><button class="tab" data-status="読書中">読書中 <small id="readingCount">0</small></button><button class="tab" data-status="読了">読了 <small id="doneCount">0</small></button></div><input class="search" id="search" aria-label="本とメモを検索" placeholder="⌕　タイトル・著者・メモで検索"></div><div class="shelf-meta"><span id="resultCount">0冊の本</span><div><select id="sort" aria-label="並べ替え"><option value="new">登録した順</option><option value="date">購入日の新しい順</option><option value="title">タイトル順</option></select>　▦</div></div></section><div id="content" class="grid"><div class="loading">本棚を開いています…</div></div><footer><span>SHIORI — A PLACE FOR YOUR THOUGHTS</span><span><button id="mobileAccess" class="export">アカウント</button> ・ <button id="mobileNotes" class="export">読書メモ</button> ・ <button id="mobileTags" class="export">タグ</button> ・ <button id="mobileExport" class="export">書き出し</button></span></footer></main><div class="overlay" id="overlay"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="dialog-head"><h2 id="dialogTitle"></h2><button class="close" id="close" aria-label="閉じる">×</button></div><div id="dialogBody"></div></section></div><div class="toast" id="toast" role="status"></div><input type="file" id="importFile" accept="application/json" hidden><script src="/auth.js"></script><script>
let state={books:[],revision:0},view='shelf',status='すべて',query='',tag='',current=null,loaded=false,busy=false,previousFocus=null;const $=s=>document.querySelector(s);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID();const tags=s=>[...new Set(s.split(/[,、\n]/).map(t=>t.trim().replace(/^#/,'' )).filter(Boolean))];let toastTimer;function toast(t){$('#toast').textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').textContent='',6000)}
async function load(){try{const r=await libraryFetch('/api/library');const d=await r.json();if(!r.ok)throw Error(d.error);state=d;loaded=true;$('#sync').textContent=account.id==='local-development'?'● ローカル保存':'● Supabase保存';$('#close').hidden=false;close();render();runAutoMetadata()}catch(e){$('#content').innerHTML='<div class="empty error">'+esc(e.message)+'<br><button class="outline" onclick="location.reload()">再読み込み</button></div>';$('#sync').textContent='接続を確認してください'}}
let pendingCommit=null;
async function commit(books){
 if(busy){toast('保存中です。少しお待ちください。');return false;}busy=true;$('#sync').textContent='● 保存中…';
 const body=JSON.stringify({books,revision:state.revision});if(!pendingCommit||pendingCommit.body!==body)pendingCommit={body,books:structuredClone(books),key:uid()};
 try{const r=await libraryFetch('/api/library',{method:'PUT',headers:{'Content-Type':'application/json','Idempotency-Key':pendingCommit.key},body});const d=await r.json();if(!r.ok){
   if(r.status===409&&$('#overlay').classList.contains('show')&&!$('#saveConflict')){const banner=document.createElement('div');banner.id='saveConflict';banner.className='note error';banner.textContent='別の端末で更新されています。今回の入力は保持しています。最新の本棚を読み直す前に、保存しようとした内容を書き出せます。';const button=document.createElement('button');button.type='button';button.className='outline';button.textContent='保存しようとした内容を書き出す';button.onclick=()=>exportData(pendingCommit.books);banner.append(document.createElement('br'),button);$('#dialogBody').prepend(banner);}
   throw Error(d.error||'保存できませんでした');
  }
  state={books,revision:d.revision};pendingCommit=null;$('#sync').textContent=account.id==='local-development'?'● ローカルに保存済み':'● Supabaseに保存済み';render();return true;
 }catch(e){toast(e.message);$('#sync').textContent='● 保存結果を確認してください・入力内容は保持中';return false;}finally{busy=false;}
}

function coverUrl(value){if(typeof value!=='string')return '';if(/^\/api\/covers\/[a-f0-9-]{36}$/.test(value))return value;try{const u=new URL(value);return u.protocol==='https:'||/^data:image\/(?:jpeg|png|webp|gif);base64,/i.test(value)?value:'';}catch{return '';}}
function cover(b,large=false){const url=coverUrl(b.cover);if(!url)return large?'':'<span class="cover-title">'+esc(b.title)+'</span>';return '<div class="cover-photo" data-title="'+esc(b.title)+'"><img src="'+esc(url)+'" alt="'+esc(b.title)+'の表紙" onerror="coverError(this)"></div>'}
function coverError(img){const frame=img.parentElement;const book=img.closest('.book');const detail=img.closest('.detail-top');if(book){book.classList.add('no-image');frame.className='cover-title';frame.textContent=frame.dataset.title;}else if(detail){detail.classList.add('without-cover');frame.remove();}}

async function uploadPhoto(data){const blob=await(await fetch(data)).blob();const r=await libraryFetch('/api/covers',{method:'POST',headers:{'Content-Type':'image/jpeg'},body:blob});const d=await r.json();if(!r.ok)throw Error(d.error||'写真を保存できませんでした。');if(!/^\/api\/covers\/[a-f0-9-]{36}$/.test(d.url))throw Error('写真の保存先を確認できませんでした。');return d.url;}
function resizePhoto(file){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{try{const canvas=document.createElement('canvas');let ratio=Math.min(1,1200/img.width,1600/img.height);for(let attempt=0;attempt<5;attempt++){canvas.width=Math.max(1,Math.round(img.width*ratio));canvas.height=Math.max(1,Math.round(img.height*ratio));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);for(const quality of [.85,.7,.55,.4]){const data=canvas.toDataURL('image/jpeg',quality);if((data.length-data.indexOf(',')-1)*.75<=300*1024){resolve(data);return;}}ratio*=.7;}reject(Error('写真のサイズを小さくできませんでした。'));}catch(e){reject(e);}finally{URL.revokeObjectURL(url);}};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('写真を読み込めませんでした。'));};img.src=url;});}

function metadataInfo(b){const m=b.metadata;const source=b.summarySource;const link=source&&safeSource(source.url);let html='<div class="bibliography">'+[b.publisher,b.label,b.isbn?'ISBN '+b.isbn:''].filter(Boolean).map(esc).join('　')+'</div>';if(source&&link)html+='<div class="source">紹介文の出典：<a href="'+link+'" target="_blank" rel="noopener noreferrer">'+esc(source.name)+' ↗</a><br>取得日：'+esc(source.checkedAt?.slice(0,10))+'</div>';else if(!b.summary)html+='<p class="hint">未記入'+(m?.status==='ambiguous'?' — 版・著者を特定できません。ISBNを入力すると再照合できます。':m?.status==='unmatched'?' — 一致する書籍を確認できませんでした。':m?.status==='matched'?' — 一致する書誌は見つかりましたが、紹介文の提供がありません。':m?.status==='error'?' — 接続できませんでした。再取得できます。':'')+'</p>';if(m?.sourceUrl&&safeSource(m.sourceUrl)&&!source)html+='<div class="source"><a href="'+safeSource(m.sourceUrl)+'" target="_blank" rel="noopener noreferrer">'+esc(m.sourceName||'書誌の出典')+' ↗</a></div>';return html;}
async function lookupMetadata(b){const r=await libraryFetch('/api/metadata',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:b.title,author:b.author||'',isbn:b.isbn||''})});const m=await r.json();if(!r.ok||m.status==='error')throw Error(m.error||'書籍検索に接続できませんでした。');return m;}
function applyMetadata(b,m){b.metadata=m;if(m.status==='matched'){if(!b.author)b.author=m.author||'';if(!b.publisher)b.publisher=m.publisher||'';if(!b.label)b.label=m.label||'';if(!b.isbn)b.isbn=m.isbn||'';if(!b.cover&&coverUrl(m.cover)){b.cover=m.cover;b.coverSource='metadata';}if(!b.summary&&m.summary){b.summary=m.summary;b.summarySource={url:m.sourceUrl,name:m.sourceName,checkedAt:m.checkedAt};}}b.metaLookupKey=metadataKey(b);return b;}
async function enrichDraft(b){try{applyMetadata(b,await lookupMetadata(b))}catch{b.metadata={status:'error',checkedAt:new Date().toISOString()}}return b;}
async function refreshOne(id){if(metadataRunning||busy){toast('自動取得中です。完了後に再取得できます。');return}const b=state.books.find(x=>x.id===id);if(!b)return;metadataRunning=true;$('#metadataProgress').textContent='「'+b.title+'」を照合しています…';try{const key=metadataKey(b);const m=await lookupMetadata(b);const latest=state.books.find(x=>x.id===id);if(!latest||metadataKey(latest)!==key)return;const books=structuredClone(state.books);applyMetadata(books.find(x=>x.id===id),m);if(await commit(books)){if(current===id&&$('#overlay').classList.contains('show'))detail(id);toast(m.status==='matched'?(m.summary?'一致した紹介文を取り込みました':'書誌を取得しました。紹介文は空欄です'):'一致を確認できないため、空欄のままにしました')}}catch{toast('接続できませんでした。時間を置いて再取得してください。')}finally{metadataRunning=false;$('#metadataProgress').textContent='自動取得は完了しました。既に記入した概要・メモは保持します。'}}
async function runAutoMetadata(force=false){if(metadataRunning||!loaded)return;const queue=state.books.filter(b=>!b.titlePending&&(force||b.autoMetadata!==false)&&(!b.summary||!b.publisher||!b.cover)&& (force||(!b.cover&&!b.metadata?.coverChecked)||!b.metadata||b.metaLookupKey!==metadataKey(b)|| (b.metadata.status==='error'&&Date.now()-Date.parse(b.metadata.checkedAt||0)>60000)));if(!queue.length)return;metadataRunning=true;$('#refreshMetadata').disabled=true;let done=0,matched=0,failed=0;try{for(const b of queue){$('#metadataProgress').textContent='ネットで書誌・紹介文を照合中… '+done+' / '+queue.length;const key=metadataKey(b);try{const m=await lookupMetadata(b);const latest=state.books.find(x=>x.id===b.id);if(!latest||metadataKey(latest)!==key){done++;continue}if(busy){failed++;done++;continue}const books=structuredClone(state.books);applyMetadata(books.find(x=>x.id===b.id),m);if(await commit(books)){if(m.status==='matched')matched++;if(current===b.id&&$('#overlay').classList.contains('show')&&$('#bookStatus'))detail(b.id)}else{failed++;break}}catch{failed++}done++;}$('#metadataProgress').textContent='照合完了：'+matched+'冊の書誌が一致。'+(failed?failed+'冊は接続・保存を確認して再取得してください。':'見つからない項目は空欄です。')}finally{metadataRunning=false;$('#refreshMetadata').disabled=false;}}
$('#refreshMetadata').onclick=()=>runAutoMetadata(true);

let account=null;
function libraryFetch(path,options={}){return fetch(path,options)}
async function copyAppUrl(){try{await navigator.clipboard.writeText(location.origin+'/');toast('共通URLをコピーしました')}catch{toast('アドレス欄のURLをコピーして送ってください')}}
function accountPanel(){if(!account)return;modal('アカウント','<p class="summary">'+esc(account.name)+'</p>'+(account.id!=='local-development'?'<button class="outline" id="setPassword">パスワードを設定・変更</button>':'')+'<button class="outline" id="logout">ログアウト</button><p id="accountStatus" role="status"></p>');if($('#setPassword'))$('#setPassword').onclick=()=>passwordForm();$('#logout').onclick=async()=>{try{const r=await fetch('/api/logout',{method:'POST'});if(!r.ok)throw Error('ログアウト処理の確認に失敗しました。画面を再読み込みしてください。');location.reload();}catch(e){$('#accountStatus').textContent=e.message;}};}
async function authRequest(body,path='/api/session'){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok){const e=Error(d.error||'処理できませんでした。時間をおいて再度お試しください。');e.status=r.status;e.retryAfterSeconds=d.retryAfterSeconds;throw e;}return d;}
function passwordForm(){
 modal('パスワードを設定','<form id="passwordForm">'+(account?.passwordChangeRequiresCurrent===false?'':'<label>現在のパスワード<input name="currentPassword" type="password" autocomplete="current-password" required></label>')+'<label>新しいパスワード（12文字以上）<input name="password" type="password" autocomplete="new-password" minlength="12" required></label><label>もう一度入力<input name="confirmation" type="password" autocomplete="new-password" minlength="12" required></label><p class="hint">パスワードは認証サービスで安全に管理されます。本棚の書き出しには含まれません。</p><div class="actions"><button class="primary">パスワードを保存</button></div><p id="passwordStatus" role="status"></p></form>');
 const form=$('#passwordForm'),message=$('#passwordStatus'),button=form.querySelector('button');
 form.onsubmit=async e=>{e.preventDefault();if(form.elements.password.value!==form.elements.confirmation.value){message.textContent='パスワードが一致しません。';return;}button.disabled=true;try{await authRequest({password:form.elements.password.value,currentPassword:form.elements.currentPassword?.value},'/api/password');form.reset();close();toast('パスワードを保存しました。次回からメールアドレスとパスワードでログインできます。');}catch(e){message.textContent=e.message;button.disabled=false;}};
}

function confirmEmailAccount(email){
 return new Promise(resolve=>{loaded=false;$('#close').hidden=true;modal('ログインするアカウントを確認','<p class="summary" id="confirmEmail"></p><p class="hint">このメールアドレスで、あなたの本棚を開きます。</p><div class="actions"><button class="outline" id="cancelEmailLogin">キャンセル</button><button class="primary" id="confirmEmailLogin">このアカウントでログイン</button></div>');$('#confirmEmail').textContent=email;$('#cancelEmailLogin').onclick=()=>resolve(false);$('#confirmEmailLogin').onclick=()=>{const button=$('#confirmEmailLogin');button.disabled=true;button.textContent='ログインしています…';resolve(true);};});
}
function showSignIn(action='login',email=''){
 loaded=false;account=null;$('#close').hidden=true;$('#content').innerHTML='';
 const signup=action==='signup',recover=action==='recover';
 modal(signup?'新しいアカウントを登録':recover?'パスワードの設定・再設定':'メールアドレスとパスワードでログイン','<form id="authForm"><label>メールアドレス<input name="email" type="email" autocomplete="email" required></label>'+(!recover?'<label>パスワード'+(signup?'（12文字以上）':'')+'<input name="password" type="password" autocomplete="'+(signup?'new-password':'current-password')+'" '+(signup?'minlength="12"':'')+' required></label>':'')+(signup?'<label>パスワードをもう一度<input name="confirmation" type="password" autocomplete="new-password" minlength="12" required></label><p class="hint">確認メールは不要です。登録後すぐに本棚を利用できます。以前登録した方は、設定済みのパスワードでログインしてください。</p>':recover?'<p class="hint">初めてパスワードを設定する場合も使えます。メールのリンクを開くと、新しいパスワードを設定できます。</p>':'<p class="hint">登録済みのメールアドレスとパスワードを入力してください。初めての方は下の「初めての方はこちら」から登録できます。</p>')+'<div class="actions"><button class="primary">'+(signup?'新規アカウントを登録':recover?'設定メールを送る':'ログインする')+'</button></div></form><p id="loginStatus" role="status"></p><div class="actions">'+(action!=='login'?'<button class="link" id="goLogin">ログインへ</button>':'')+(action==='login'?'<button class="link" id="goSignup">初めての方はこちら</button>':'')+(action!=='recover'?'<button class="link" id="goRecover">パスワードを設定・再設定</button>':'')+'</div>');
 const form=$('#authForm'),message=$('#loginStatus'),button=form.querySelector('button');form.elements.email.value=email;
 for(const [id,target]of [['goLogin','login'],['goSignup','signup'],['goRecover','recover']])if($('#'+id))$('#'+id).onclick=()=>showSignIn(target,form.elements.email.value);
 form.onsubmit=async e=>{e.preventDefault();if(button.disabled)return;if(signup&&form.elements.password.value!==form.elements.confirmation.value){message.textContent='パスワードが一致しません。';return;}button.disabled=true;message.textContent=recover?'設定メールを送信しています…':'確認しています…';
  try{const d=await authRequest({action,email:form.elements.email.value.trim(),...(!recover?{password:form.elements.password.value}:{})});if(form.elements.password)form.elements.password.value='';if(form.elements.confirmation)form.elements.confirmation.value='';
   if(d.signupRequested||d.confirmationRequired){message.textContent='新規登録の依頼を受け付けました。初めて登録する方は確認メールをご確認ください。以前利用したメールアドレスへの再登録では、メールが送られない場合があります。「パスワードを設定・再設定」へ進んでください。';button.textContent='登録依頼を受け付けました';}
   else if(d.recoveryRequested||d.sent){message.textContent='設定の依頼を受け付けました。登録済みのメールアドレスなら設定メールが届きます。最新のリンクを開いてパスワードを設定してください。';button.textContent='設定の依頼を受け付けました';}
   else location.reload();
  }catch(e){message.textContent=e.message;if(e.status===429&&(recover||signup)){button.textContent='メール送信制限中';if(e.retryAfterSeconds){const until=Date.now()+e.retryAfterSeconds*1000;const timer=setInterval(()=>{if(!button.isConnected){clearInterval(timer);return;}const seconds=Math.max(0,Math.ceil((until-Date.now())/1000));button.textContent=seconds?'再試行まで '+seconds+'秒':'再試行';if(!seconds){button.disabled=false;clearInterval(timer);}},1000);}}else button.disabled=false;}
 };
}

async function startAccount(){try{localStorage.removeItem('shiori-library-key')}catch{}try{const linked=await completeEmailLink({confirmAccount:confirmEmailAccount});const r=await fetch('/api/account');if(r.status===401){if(linked)throw Error('ログイン情報を保存できませんでした。このサイトのCookieを許可し、通常のブラウザでリンクを開いてください。');showSignIn();return}if(!r.ok)throw Error();account=await r.json();$('#accountName').textContent=account.name||'アカウント';await load();if(linked&&linked.recovery)passwordForm()}catch(e){loaded=false;$('#close').hidden=true;modal('ログインを確認してください','<p class="summary">'+esc(e.message||'アカウント情報を読み込めませんでした。')+'</p><button class="primary" id="retryAccount">ログイン画面へ</button>');$('#retryAccount').onclick=()=>showSignIn();}}
window.addEventListener('hashchange',()=>{if(location.hash)history.replaceState(null,'',location.pathname)});
$('#accountButton').onclick=accountPanel;$('#shareApp').onclick=copyAppUrl;$('#mobileAccess').onclick=accountPanel;

$('#add').onclick=addModal;$('#close').onclick=close;$('#overlay').onclick=e=>{if(e.target===$('#overlay'))close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Tab'&&$('#overlay').classList.contains('show')){const nodes=[...$('#overlay').querySelectorAll('button,input,textarea,select,a[href]')].filter(x=>!x.disabled&&x.offsetParent);const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});document.addEventListener('click',async e=>{const b=e.target.closest('[data-book]');if(b){detail(b.dataset.book);return}const t=e.target.closest('[data-tag]');if(t){view='tags';tag=t.dataset.tag;status='すべて';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.status===status));close();render();return}const n=e.target.closest('[data-edit-note]');if(n){const b=state.books.find(b=>b.id===current);noteForm(b,b.notes.find(x=>x.id===n.dataset.editNote));return}const d=e.target.closest('[data-del-note]');if(d){const b=state.books.find(b=>b.id===current);modal('このメモを削除しますか','<p class="summary">削除すると元に戻せません。</p><div class="actions"><button id="cancelDeleteNote" class="outline">戻る</button><button id="confirmDeleteNote" class="primary">削除する</button></div>');$('#cancelDeleteNote').onclick=()=>detail(b.id);$('#confirmDeleteNote').onclick=async()=>{const books=structuredClone(state.books);books.find(x=>x.id===b.id).notes=b.notes.filter(x=>x.id!==d.dataset.delNote);if(await commit(books))detail(b.id)}}});document.querySelectorAll('[data-view]').forEach(e=>e.onclick=()=>{view=e.dataset.view;tag='';render()});document.querySelectorAll('[data-status]').forEach(e=>e.onclick=()=>{status=e.dataset.status;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===e));render()});$('#search').oninput=e=>{query=e.target.value;render()};$('#sort').onchange=render;$('#festival').onclick=()=>{view='shelf';query='神保町古本まつり';$('#search').value=query;status='すべて';tag='';render()};async function exportData(booksOverride){try{toast('写真を含むバックアップを準備しています…');const books=structuredClone(Array.isArray(booksOverride)?booksOverride:state.books);for(const b of books){if(/^\/api\/covers\//.test(b.cover||'')){const r=await libraryFetch(b.cover);if(!r.ok)throw Error();const blob=await r.blob();b.cover=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(blob);});}}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),books},null,2)],{type:'application/json'}));a.download='shiori-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('写真を含めてバックアップを書き出しました');}catch{toast('写真を取得できず、バックアップを作成できませんでした。時間をおいて再度お試しください。');}}$('#export').onclick=exportData;$('#mobileExport').onclick=exportData;$('#mobileNotes').onclick=()=>{view='notes';tag='';render()};$('#mobileTags').onclick=()=>{view='tags';tag='';render()};$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const data=JSON.parse(await f.text());if(!Array.isArray(data.books)||!data.books.every(b=>typeof b.id==='string'&&typeof b.title==='string'&&Array.isArray(b.notes)&&Array.isArray(b.tags)))throw Error();const fresh=data.books.filter(b=>!state.books.some(x=>x.id===b.id));for(const b of fresh){if(typeof b.cover==='string'&&b.cover.startsWith('data:image/'))b.cover=await uploadPhoto(await resizePhoto(await(await fetch(b.cover)).blob()));}if(await commit([...state.books,...fresh]))toast(fresh.length+'冊を読み込みました（同じIDの本は保持）')}catch{toast('栞のバックアップファイルを選択してください')}e.target.value=''};startAccount();
</script></body></html>
